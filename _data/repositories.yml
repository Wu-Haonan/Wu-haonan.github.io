github_users:
  - Wu-Haonan

repo_description_lines_max: 4

sections:
  - title: Repeat-Robust $k$-mer-based Mutation Rate Estimators
    note: >
      A repeat-robust $k$-mer-based mutation rate estimator that published in [ISMB 2026](https://academic.oup.com/bioinformatics/article/42/Supplement_1/btag234/8726344)
    repos:
      - name: medvedevgroup/Accurate_repeat-aware_kmer_based_estimator
        note: >
          This is the publication repository of our ISMB 2026 paper.
      - name: Wu-Haonan/sourmash-plugin-repeat-robust-mutation-rate-estimators
        note: >
          This is an improved implementation of the estimator as a sourmash plugin.

  - title: Repeat-Aware $k$-mer-based Mutation Rate Estimators
    note: >
      A repeat-aware $k$-mer-based mutation rate estimator that published in [WABI 2025](https://drops.dagstuhl.de/entities/document/10.4230/LIPIcs.WABI.2025.20), which needs the abundance histograms of $k$-mers in the reference genome.
    repos:
      - name: medvedevgroup/Repeat-Aware_Substitution_Rate_Estimator
        note: >
          This is the publication repository of our WABI 2025 paper.
      - name: Wu-Haonan/Repeat-Aware_mutation_rate_estimator
        note: >
          This is an improved implementation of the estimator by leveraging KMC and sourmash. 
      - name: Wu-Haonan/Repeat-Aware_phylogenetic_distance_estimator
        note: >
          We extend the estimator to construct Neighbor-Joining (NJ) tree among multiple genomes in parallel.

  - title: Protein-Protein Interaction Sites Prediction
    note: >
      A structural-based predicting protein-protein interaction sites using the graph neural network.
      Our tool Spatom is also hosted on the webserver (http://118.190.151.48/Spatom/server)
    repos:
      - name: Wu-Haonan/Spatom
